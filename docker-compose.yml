services:
  db:
    image: postgres:15
    container_name: msindravir_db
    environment:
      POSTGRES_DB: officesahayek
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: securepassword123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d officesahayek"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: msindravir_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql://admin:securepassword123@db:5432/officesahayek
      SECRET_KEY: officesahayek-jwt-secret-change-in-production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: msindravir_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: