version: "3.9"

services:

  backend:
    build: ./backend
    container_name: msindravir_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: msindravir_frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend